# 設定ファイル例

# GA4アカウントID（必須）
account_id: "123456789"

# プロパティ表示名
property_display_name: "マイサイト"

# WebサイトURL
website_url: "https://example.com"

# タイムゾーン（デフォルト: Asia/Tokyo）
time_zone: "Asia/Tokyo"

# 通貨コード（デフォルト: JPY）
currency_code: "JPY"

# 作成するキーイベント
key_events:
  - form_submit
  - file_download
  - tel_click

# property_id（自動セットアップ後に自動保存されます）
# property_id: "123456789"
# property_name: "properties/123456789"
